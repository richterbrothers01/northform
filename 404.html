<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Page not found — NorthForm</title>
    <meta name="theme-color" content="#FDFCF8">
    <link rel="icon" type="image/jpeg" href="assets/logo.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <style>
        .notfound {
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px var(--pad-x);
        }
        .notfound__code {
            font-size: clamp(4rem, 14vw, 9rem);
            font-weight: 600;
            letter-spacing: -0.04em;
            color: var(--line);
        }
        .notfound__title {
            margin-top: 8px;
            font-size: clamp(1.5rem, 3vw, 2.2rem);
            font-weight: 500;
            letter-spacing: -0.02em;
        }
        .notfound__text {
            margin-top: 14px;
            max-width: 46ch;
            color: var(--ink-soft);
            font-size: 1.0625rem;
            line-height: 1.7;
        }
        .notfound .btn { margin-top: 32px; }
    </style>
</head>
<body>
    <a href="#main" class="skip-link">Skip to content</a>
    <div class="progress-bar" id="progressBar" aria-hidden="true"></div>
    <nav class="nav is-scrolled" id="nav">
        <div class="nav__container">
            <a href="index.html" class="nav__logo" aria-label="NorthForm Home">
                <svg class="nav__logo-mark" viewBox="0 0 100 100" aria-hidden="true">
                    <path class="logo-path" d="M20 80 L20 30 Q20 15 35 15 L65 15 Q80 15 80 30 L80 80 Z M35 30 L35 70 M65 30 L65 70" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span class="nav__logo-text">NorthForm</span>
            </a>
            <div class="nav__utility">
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>
                </button>
            </div>
        </div>
    </nav>

    <main id="main">
        <section class="notfound">
            <p class="notfound__code">404</p>
            <h1 class="notfound__title">This page went missing.</h1>
            <p class="notfound__text">The page you're looking for doesn't exist or may have moved. Let's get you back to solid ground.</p>
            <a href="index.html" class="btn btn--primary">Back to home <span class="btn__arrow" aria-hidden="true">→</span></a>
        </section>
    </main>

    <button class="back-to-top" id="backToTop" aria-label="Back to top">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
    </button>

    <script src="js/main.js"></script>
</body>
</html>
